<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>avatar</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  canvas { display: block; }
  #bubble {
    position: absolute; left: 12px; right: 12px; top: 10px; padding: 8px 12px; border-radius: 14px;
    background: rgba(30, 30, 46, .82); color: #f5e0dc; font: 14px/1.35 "Inter", "Noto Sans", sans-serif;
    box-shadow: 0 4px 18px rgba(0,0,0,.35); opacity: 0; transform: translateY(-6px);
    transition: opacity .35s cubic-bezier(.4,0,.2,1), transform .35s cubic-bezier(.2,1,.3,1); pointer-events: none;
  }
  #bubble.on { opacity: 1; transform: none; }
  /* words fade in as she says them (app.js reveal()); they already take their space, so nothing reflows */
  #bubble .w { opacity: 0; filter: blur(2px); transition: opacity .22s ease-out, filter .3s ease-out; }
  #bubble .w.on { opacity: 1; filter: none; }
  #bubble.swap { transition: opacity .14s; opacity: 0 !important; }
  #state {
    position: absolute; right: 16px; bottom: 16px; width: 14px; height: 14px; border-radius: 50%;
    background: transparent; transition: background .2s, box-shadow .2s; pointer-events: none;
  }
  #state.listening { background: #f38ba8; box-shadow: 0 0 0 0 rgba(243,139,168,.7); animation: pulse 1.2s infinite; }
  #state.thinking, #state.thinking_hard { background: #89b4fa; animation: blink 1s infinite; }
  #state.thinking_hard { background: #cba6f7; }
  #state.confirming { background: #f9e2af; animation: pulse 1.2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(243,139,168,0); } 100% { box-shadow: 0 0 0 0 rgba(243,139,168,0); } }
  @keyframes blink { 50% { opacity: .35; } }

  /* ── stage (full-monitor layout): screen glow, working capsule, sparkle layer ── */
  :root { --pink: #f5c2e7; --mauve: #cba6f7; --lav: #b4befe; --text: #f5e0dc; --sub: #a6adc8; }
  /* speech bubble on the stage: dark glass with a pink→mauve hairline, a tail toward her, a soft lift-in */
  body.stage #bubble { left: auto; right: auto; width: max-content; max-width: 340px; padding: 12px 18px; border-radius: 18px;
                       font-size: 15.5px; line-height: 1.45; letter-spacing: .1px; color: #f5e0dc;
                       border: 1px solid transparent;
                       background: linear-gradient(180deg, rgba(49,50,68,.95), rgba(30,30,46,.95)) padding-box,
                                   linear-gradient(135deg, rgba(245,194,231,.75), rgba(203,166,247,.55) 55%, rgba(180,190,254,.4)) border-box;
                       box-shadow: 0 10px 30px rgba(17,17,27,.45), 0 0 26px rgba(245,194,231,.18);
                       transform-origin: 50% 100%; opacity: 0;
                       transform: translate(-50%, -100%) translateY(10px) scale(.94);
                       transition: opacity .38s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.2,1.25,.4,1); }
  body.stage #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px;
                              margin-left: -6px; transform: rotate(45deg); background: rgb(30,30,46);
                              border: solid rgba(203,166,247,.55); border-width: 0 1px 1px 0; border-radius: 0 0 3px 0; }
  body.stage #bubble.on { opacity: 1; transform: translate(-50%, -100%); }
  body.stage #bubble.side { transform-origin: 0 50%; transform: translate(0, -50%) translateX(-10px) scale(.94); }
  body.stage #bubble.side.on { transform: translate(0, -50%); }
  body.stage #bubble.side::after { left: -7px; top: 50%; bottom: auto; margin: -6px 0 0; transform: rotate(135deg); }
  body.stage #bubble.side.left { transform-origin: 100% 50%; transform: translate(-100%, -50%) translateX(10px) scale(.94); }
  body.stage #bubble.side.left.on { transform: translate(-100%, -50%); }
  body.stage #bubble.side.left::after { left: auto; right: -7px; transform: rotate(-45deg); }
  body.stage #state { display: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  /* glow: one layer per colour, each only ever crossfades its opacity (colours can't animate in CSS), and the
     breathing runs on an inner layer so a state change never restarts or snaps it */
  #glow { position: absolute; inset: 0; pointer-events: none; }
  #glow .g { position: absolute; inset: 0; opacity: 0; transition: opacity .9s cubic-bezier(.4,0,.2,1); }
  #glow .g::before { content: ""; position: absolute; inset: 0; will-change: opacity;
                     box-shadow: inset 0 0 40px 10px var(--g1), inset 0 0 120px 30px var(--g2);
                     animation: breathe 3s ease-in-out infinite; }
  #glow .pink  { --g1: rgba(245,194,231,.85); --g2: rgba(203,166,247,.45); }
  #glow .blue  { --g1: rgba(137,180,250,.55); --g2: rgba(180,190,254,.25); }
  #glow .amber { --g1: rgba(249,226,175,.6);  --g2: rgba(245,194,231,.3); }
  #glow .amber::before { animation-duration: 1.8s; }
  /* speaking: pink/mauve that swells with her voice; app.js drives the inner layer's opacity, so no breathing */
  #glow .voice { --g1: rgba(245,194,231,.8); --g2: rgba(203,166,247,.5); }
  #glow .voice::before { animation: none; opacity: var(--v, .45); }
  #glow .red   { --g1: rgba(250,179,135,.85); --g2: rgba(243,139,168,.4); }
  #glow .red::before { animation: none; }
  #glow .red.flick::before { animation: flicker 1.1s ease-in-out 1; }
  #glow .g:not(.live)::before { animation: none; }  /* nothing runs on layers nobody can see: each costs a full-screen frame */
  #glow.still .g::before { animation: none; }  /* the arrival swell doesn't breathe */
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes flicker { 0% { opacity: 1; } 18% { opacity: .35; } 36% { opacity: 1; } 54% { opacity: .5; } 100% { opacity: .9; } }

  #status { position: absolute; display: flex; align-items: center; gap: 14px; padding: 9px 22px 9px 9px; border-radius: 999px;
            background: rgba(30,30,46,.92); font-family: "Inter", "Noto Sans", sans-serif; pointer-events: none;
            box-shadow: 0 8px 28px rgba(0,0,0,.4), 0 0 24px rgba(203,166,247,.25), inset 0 0 0 1px rgba(203,166,247,.35);
            opacity: 0; transform: translate(-100%, -50%); transform-origin: right center;
            transition: opacity .35s, clip-path .55s cubic-bezier(.2,1,.3,1); clip-path: inset(0 0 0 85% round 999px); }
  #status.right { transform: translate(0, -50%); clip-path: inset(0 85% 0 0 round 999px); }
  #status.on { opacity: 1; clip-path: inset(-60px -60px -60px -60px round 999px); }
  #status::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                   background: linear-gradient(105deg, transparent 35%, rgba(245,194,231,.16) 48%, rgba(255,255,255,.22) 50%, rgba(203,166,247,.16) 52%, transparent 65%);
                   background-size: 250% 100%; animation: shimmer 3.2s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position: 130% 0; } 55%, 100% { background-position: -30% 0; } }
  .badge { position: relative; width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center;
           background: radial-gradient(circle at 35% 30%, rgba(245,194,231,.28), rgba(203,166,247,.12)); animation: pulse 2.4s ease-in-out infinite; }
  .badge::before { content: ""; position: absolute; inset: -3px; border-radius: 50%;
                   background: conic-gradient(from 0deg, transparent 0 55%, var(--mauve) 80%, var(--pink) 100%);
                   -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
                   animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes pulse { 50% { box-shadow: 0 0 18px 2px rgba(245,194,231,.45); } }
  .badge svg { width: 24px; height: 24px; position: absolute; transition: opacity .35s, transform .35s; }
  .badge svg.out { opacity: 0; transform: scale(.6) rotate(-20deg); }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--pink); animation: ring .7s ease-out forwards; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
  .stext { min-width: 170px; max-width: 300px; position: relative; height: 38px; }
  .sline { position: absolute; left: 0; top: 0; right: 0; transition: opacity .35s, transform .35s; white-space: nowrap; }
  .sline.out { opacity: 0; transform: translateY(6px); }
  .stitle { color: var(--text); font-size: 14.5px; font-weight: 600; line-height: 19px; }
  .sdetail { color: var(--sub); font-size: 12.5px; line-height: 19px; overflow: hidden; text-overflow: ellipsis; }
  .sdetail .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .bar { position: absolute; left: 0; right: 0; bottom: -7px; height: 2px; border-radius: 2px; background: rgba(203,166,247,.15); overflow: hidden; }
  .bar::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px;
                 background: linear-gradient(90deg, transparent, var(--pink), var(--mauve), transparent); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }
  .trail { position: absolute; border-radius: 50%; background: rgba(30,30,46,.92); box-shadow: inset 0 0 0 1px rgba(203,166,247,.35);
           opacity: 0; transition: opacity .45s; pointer-events: none; animation: think 1.4s ease-in-out infinite; }
  .trail.on { opacity: 1; }
  #t1.on { transition-delay: .08s; } #t2.on { transition-delay: .16s; }
  #t2 { animation-delay: .2s; }
  @keyframes think { 0%, 100% { transform: scale(.85); } 40% { transform: scale(1.15);
                     box-shadow: inset 0 0 0 1px rgba(245,194,231,.7), 0 0 8px rgba(245,194,231,.6); } }
  /* the line of light she materialises behind (app.js materialise()); only exists for those 0.3 s */
  #reveal { display: none; position: absolute; height: 44px; margin-top: -22px; pointer-events: none; border-radius: 50%; filter: blur(5px);
            background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(245,194,231,.7) 45%, rgba(203,166,247,.25) 72%, transparent); }
  /* the capsule's animations only run while it's up (a few frames longer, so it fades out alive) */
  #status.asleep *, #status.asleep::after, #status.asleep *::before, #status.asleep *::after, .trail.asleep { animation: none; }
</style>
</head>
<body>
<div id="glow"><i class="g pink"></i><i class="g blue"></i><i class="g amber"></i><i class="g red"></i><i class="g voice"></i></div>
<div id="reveal"></div>
<div id="bubble"></div>
<div id="state"></div>
<span class="trail asleep" id="t1"></span><span class="trail asleep" id="t2"></span>
<div id="status" class="asleep"><div class="badge" id="badge"></div><div class="stext" id="stext"><div class="bar"></div></div></div>
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/cubism4.min.js"></script>
<script src="app.js"></script>
</body>
</html>
