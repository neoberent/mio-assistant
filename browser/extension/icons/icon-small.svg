<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313244"/><stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cfeb"/><stop offset="1" stop-color="#eba6d6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#cba6f7" stroke-opacity=".55" stroke-width="3"/>
  <!-- hair back, falling to the shoulders -->
  <path d="M24 66 C22 36 42 20 64 20 C86 20 106 36 104 66 L106 104 C98 110 90 108 86 100 L42 100 C38 108 30 110 22 104 Z" fill="url(#hair)"/>
  <!-- face -->
  <ellipse cx="64" cy="70" rx="29" ry="27" fill="#fde9e4"/>
  <!-- bangs -->
  <path d="M33 62 C34 40 48 30 64 30 C80 30 94 40 95 62 C88 56 84 48 82 42 C78 52 70 56 62 56 C66 50 66 44 64 40 C58 50 46 58 33 62 Z" fill="url(#hair)"/>
  <!-- happy ^^ eyes -->
  <path d="M46 74 Q52 66 58 74" fill="none" stroke="#45475a" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 74 Q76 66 82 74" fill="none" stroke="#45475a" stroke-width="8" stroke-linecap="round"/>
  <!-- mauve bow -->
  <g transform="translate(88 30) rotate(18)">
    <path d="M0 0 C-6 -12 -22 -12 -20 0 C-22 12 -6 12 0 0 Z" fill="#cba6f7"/>
    <path d="M0 0 C6 -12 22 -12 20 0 C22 12 6 12 0 0 Z" fill="#cba6f7"/>
    <circle r="5" fill="#b48ef0"/>
  </g>
</svg>
